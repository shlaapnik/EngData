x-zookeeper: &zookeeper
  image: zookeeper:3.9.6
  command: zkServer.sh start-foreground
  restart: "no"

services:
  zk1:
    <<: *zookeeper
    hostname: zk1
    container_name: engdata-zk1
    environment:
      ZOO_MY_ID: 1
      ZOO_DATA_DIR: /data/zk1
    ports:
      - "2181:2181"
    volumes:
      - ./zk1/conf/zoo.cfg:/conf/zoo.cfg:ro
      - zk1-data:/data/zk1

  zk2:
    <<: *zookeeper
    hostname: zk2
    container_name: engdata-zk2
    environment:
      ZOO_MY_ID: 2
      ZOO_DATA_DIR: /data/zk2
    ports:
      - "2182:2182"
    volumes:
      - ./zk2/conf/zoo.cfg:/conf/zoo.cfg:ro
      - zk2-data:/data/zk2

  zk3:
    <<: *zookeeper
    hostname: zk3
    container_name: engdata-zk3
    environment:
      ZOO_MY_ID: 3
      ZOO_DATA_DIR: /data/zk3
    ports:
      - "2183:2183"
    volumes:
      - ./zk3/conf/zoo.cfg:/conf/zoo.cfg:ro
      - zk3-data:/data/zk3

volumes:
  zk1-data:
  zk2-data:
  zk3-data:
